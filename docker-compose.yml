services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pickup_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pickup_api_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pickup_api"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pickup_api_postgres:
